apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-nginx
  namespace: zammad

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: zammad-nginx

  template:
    metadata:
      labels:
        app: zammad-nginx

    spec:
      containers:
        - name: nginx
          image: ghcr.io/zammad/zammad:7.2.2-0000
          imagePullPolicy: IfNotPresent

          command:
            - zammad-nginx

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: zammad-config
            - secretRef:
                name: zammad-db-secret

          volumeMounts:
            - name: zammad-storage
              mountPath: /opt/zammad/storage

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi

          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30

      volumes:
        - name: zammad-storage
          persistentVolumeClaim:
            claimName: zammad-storage-pvc