apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-railsserver
  namespace: zammad

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: zammad-railsserver

  template:
    metadata:
      labels:
        app: zammad-railsserver

    spec:
      containers:
        - name: railsserver
          image: ghcr.io/zammad/zammad:7.2.2-0000
          imagePullPolicy: IfNotPresent

          command:
            - zammad-railsserver

          ports:
            - name: http
              containerPort: 3000

          envFrom:
            - configMapRef:
                name: zammad-config
            - secretRef:
                name: zammad-db-secret

          volumeMounts:
            - name: zammad-storage
              mountPath: /opt/zammad/storage

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi

          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 10
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: zammad-storage
          persistentVolumeClaim:
            claimName: zammad-storage-pvc