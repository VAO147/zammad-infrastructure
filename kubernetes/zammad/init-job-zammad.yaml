apiVersion: batch/v1
kind: Job
metadata:
  name: zammad-init
  namespace: zammad

spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: zammad-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: zammad-init
          image: ghcr.io/zammad/zammad:7.2.2-0000
          imagePullPolicy: IfNotPresent

          command:
            - zammad-init

          envFrom:
            - configMapRef:
                name: zammad-config
            - secretRef:
                name: zammad-db-secret

          volumeMounts:
            - name: zammad-storage
              mountPath: /opt/zammad/storage

          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi

      volumes:
        - name: zammad-storage
          persistentVolumeClaim:
            claimName: zammad-storage-pvc